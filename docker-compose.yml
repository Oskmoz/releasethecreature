# Lancement : DOMAIN=creature.mondomaine.fr docker compose up -d --build
#
# Réglages Traefik (valeurs par défaut entre parenthèses), à mettre dans un fichier .env à côté de ce fichier :
#   DOMAIN               nom de domaine du jeu (obligatoire)
#   TRAEFIK_NETWORK      réseau Docker sur lequel tourne Traefik (traefik)
#   TRAEFIK_ENTRYPOINT   entrypoint HTTPS de Traefik (websecure)
#   DATA_PATH            dossier de l'hôte où sont stockées les données du jeu (./data)
#   TRAEFIK_CERTRESOLVER resolver de certificats Let's Encrypt (letsencrypt)
#   GA_ID                ID de mesure Google Analytics (G-XXXXXXXXXX), vide = pas de suivi
#   ADMIN_TOKEN          jeton secret de l'admin (32 caractères min. : openssl rand -hex 32), vide = pas d'admin.
#                        Pour l'activer dans ton navigateur : ouvre https://DOMAIN/?admin et colle le jeton.
# Pour trouver le réseau de ton Traefik : docker inspect <conteneur-traefik> --format '{{json .NetworkSettings.Networks}}'
# Le resolver doit exister dans la config statique de Traefik (section certificatesResolvers), sinon Traefik
# sert son « TRAEFIK DEFAULT CERT » : docker logs <conteneur-traefik> 2>&1 | grep -i resolver
services:
  creature:
    build: .
    container_name: creature
    restart: unless-stopped
    environment:
      # Derrière Traefik : faire confiance à X-Forwarded-For pour connaître la vraie IP (limites anti-spam)
      - TRUST_PROXY=1
      # Google Analytics (facultatif) : chargé seulement après consentement du visiteur
      - GA_ID=${GA_ID:-}
      # Admin (facultatif) : outils réservés à qui connaît ce jeton
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Adresse publique pour le référencement (balises de partage, robots.txt, sitemap.xml)
      - DOMAIN=${DOMAIN}
    volumes:
      # Dossier de l'hôte (./data par défaut) : facile à consulter et à sauvegarder, survit à tout
      # (redémarrage, rebuild, docker compose down -v). Doit appartenir à l'UID 1000 (utilisateur node).
      - ${DATA_PATH:-./data}:/data
    networks:
      - traefik
    # Aucun port publié : le conteneur n'est joignable qu'à travers Traefik.

    # --- Confinement : même en cas de faille dans l'appli, l'attaquant reste enfermé ---
    read_only: true                # système de fichiers en lecture seule (seul /data est inscriptible)
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL                        # aucun privilège Linux (inutile pour écouter sur le port 3000)
    security_opt:
      - no-new-privileges:true     # impossible de regagner des droits (setuid…)
    mem_limit: 256m                # une fuite mémoire ou un abus ne peut pas affamer la VM
    cpus: 1.0
    pids_limit: 64
    logging:                       # logs bornés : ils ne rempliront pas le disque de la VM
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.creature.rule=Host(`${DOMAIN:?définir DOMAIN}`)
      - traefik.http.routers.creature.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.creature.tls=true
      - traefik.http.routers.creature.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.creature.loadbalancer.server.port=3000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
